services:
  mongodb:
    image: mongo:7.0
    container_name: boxoffice-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - boxoffice-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boxoffice-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/boxoffice-sim
      - JWT_ACCESS_SECRET=production_access_token_secret_key_minimum_32_characters_long
      - JWT_REFRESH_SECRET=production_refresh_token_secret_key_minimum_32_characters_long
      - CLIENT_URL=http://localhost:5173
      - RATE_LIMIT_STORE=mongodb
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - boxoffice-network

volumes:
  mongo-data:
    driver: local

networks:
  boxoffice-network:
    driver: bridge
