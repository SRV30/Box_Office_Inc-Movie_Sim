version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: boxoffice-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-boxoffice}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-boxoffice_secret}
      MONGO_INITDB_DATABASE: boxoffice_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - boxoffice-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: boxoffice-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_USERNAME:-boxoffice}:${MONGO_PASSWORD:-boxoffice_secret}@mongodb:27017/boxoffice_db?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-in-production-64-chars-minimum-secret-key-here-now}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production-64-chars-minimum-refresh-key-here}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - boxoffice-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: node:18-alpine
    container_name: boxoffice-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_API_URL: http://localhost:${PORT:-5000}/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - boxoffice-network
    profiles:
      - dev

volumes:
  mongodb_data:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  boxoffice-network:
    driver: bridge
