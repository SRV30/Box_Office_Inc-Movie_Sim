name: CI
on: [push, pull_request]

jobs:
  backend-test:
    name: Backend Test Suite & V1 Acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run Backend & V1 Acceptance Tests
        working-directory: backend
        run: npm test

  frontend-check:
    name: Frontend Build & Lint Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint
      - name: Build Frontend
        working-directory: frontend
        run: npm run build
