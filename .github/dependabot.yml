# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for the frontend application
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "frontend"
    assignees:
      - "SRV30"
    reviewers:
      - "SRV30"
    commit-message:
      prefix: "chore(deps-frontend)"
      include: "scope"

  # Maintain dependencies for the backend Node.js application
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "backend"
    assignees:
      - "SRV30"
    reviewers:
      - "SRV30"
    commit-message:
      prefix: "chore(deps-backend)"
      include: "scope"

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "SRV30"
    reviewers:
      - "SRV30"
    commit-message:
      prefix: "chore(deps-actions)"
      include: "scope"
